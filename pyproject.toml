[project]
name = "django-blog-site"
version = "0.1.0"
description = "Educational Django blog project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django==5.0.6",
    "django-debug-toolbar==4.3.0",
    "django-extensions==3.2.3",
    "pillow==10.3.0",
    "python-dotenv==1.0.1",
]

[dependency-groups]
dev = [
    "ruff>=0.11.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
